<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lemnaria — scenă 3D configurator</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body { margin:0; height:100%; background:#f2f0ea; overflow:hidden; }
  three-d-stage { display:block; width:100%; height:100%; }
  three-d-stage:not(:defined) { visibility:hidden; }
  #tap { position:absolute; inset:auto 0 0 0; padding:10px 14px 14px; text-align:center;
         font:11.5px/1.4 Helvetica,Arial,sans-serif; letter-spacing:.04em; color:#7d7a72;
         pointer-events:none; transition:opacity .4s; }
</style>
</head>
<body>
<three-d-stage name="kitchen-l" background="#f2f0ea"></three-d-stage>
<div id="tap">Atinge un corp pentru a-l edita · trage pentru a roti</div>
<script src="./three-d-stage.js"></script>
<script type="module">
import { makeKit } from './kitchen-parts.js';

const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const { builders, M, make } = makeKit(THREE);

const room = builders['kitchen-l']();
stage.setObject(room);

// This page is the configurator's editing surface, not the part library:
// no export toolbar, no orbit legend of its own.
const sr = stage.shadowRoot;
if (sr) sr.querySelectorAll('.toolbar, .note').forEach(n => n.remove());
const canvas = sr ? sr.querySelector('canvas') : null;
const camera = stage._camera, controls = stage._controls;

/* ---- catalogue of selectable placements -------------------------------- */
const LABEL = {
  corner_base_x: 'Corp de colț cu carusel',
  corner_base_return: 'Retur de colț',
  base_cabinet: 'Corp bază',
  dishwasher_housing: 'Nișă mașină de spălat vase',
  fridge_freestanding: 'Frigider',
  induction_cooktop: 'Plită cu inducție',
  wall_cabinet: 'Corp suspendat',
  open_shelf_unit: 'Etajeră deschisă',
  extractor_hood: 'Hotă',
  tall_unit: 'Coloană',
};

const items = [];        // bodies actually standing in the room
let voids = [];          // free spans, derived — never authored
const cols = new Map();  // one vertical run of modules, keyed by wall + position
const V = () => new THREE.Vector3();
const mm = v => Math.round(v * 1000 / 10) * 10;

room.children.forEach(child => {
  if (!child.isGroup) return;                       // walls, floor, splashback, end panel
  const bb = new THREE.Box3().setFromObject(child);
  const size = bb.getSize(V());
  const rotated = Math.abs(child.rotation.y) > 0.01;
  // Nominal dimensions come from the carcass/body, never from the group's
  // bounding box — faucets, proud appliance fronts and hood chimneys would
  // otherwise print non-module numbers into the editor read-out.
  const body = new THREE.Box3();
  child.traverse(o => {
    if (o.isMesh && /carcass_shell|side_left|side_right|panel_bottom|fridge_body|hood_canopy|dw_body|cooktop_glass/.test(o.name))
      body.expandByObject(o);
  });
  const bodySize = body.isEmpty() ? size : body.getSize(V());
  const frame = {
    x: child.position.x, z: child.position.z, ry: child.rotation.y,
    y0: bb.min.y, h: size.y,
    w: rotated ? bodySize.z : bodySize.x,
    d: rotated ? size.x : size.z,
  };
  const col = (rotated ? 'B|' : 'A|') + (rotated ? frame.z : frame.x).toFixed(2);
  const doors = [], handles = [];
  child.traverse(o => {
    if (!o.isMesh) return;
    if (/door_front|drawer_front/.test(o.name)) doors.push(o);
    if (/handle/.test(o.name)) handles.push(o);
  });
  const it = {
    id: 'p' + items.length, obj: child, doors, handles, kind: child.name,
    empty: false, frame, col, rotated, wall: rotated ? 'B' : 'A',
  };
  // Worktop-mounted appliances (a hob is 20 mm of glass) are accessories of the
  // cabinet they sit in, not openings of their own: no swap set, no delete, and
  // a click on one selects its host cabinet.
  it.accessory = frame.h < 0.3;
  items.push(it);
  describe(it);
  if (it.accessory) return;                          // no column geometry of its own
  // The column records the geometry every body in this vertical shares, plus
  // how high the run reaches — that is the ceiling a column unit may fill to.
  const c = cols.get(col) || { key: col, ry: frame.ry, w: Infinity, d: 0, x: frame.x, z: frame.z, top: 0, regions: [] };
  c.w = Math.min(c.w, frame.w);
  if (frame.d > c.d) { c.d = frame.d; c.x = frame.x; c.z = frame.z; }
  c.top = Math.max(c.top, frame.y0 + frame.h);
  c.regions.push([frame.y0, frame.y0 + frame.h]);
  cols.set(col, c);
});

// Everything the panel reads off a body, derived from the body itself so it
// stays true after a swap.
function describe(it) {
  const bb = new THREE.Box3().setFromObject(it.obj);
  const body = new THREE.Box3();
  it.obj.traverse(o => {
    if (o.isMesh && /carcass_shell|side_left|side_right|panel_bottom|fridge_body|hood_canopy|dw_body|cooktop_glass/.test(o.name))
      body.expandByObject(o);
  });
  const bs = body.isEmpty() ? bb.getSize(V()) : body.getSize(V());
  it.kind = it.obj.name || it.kind;
  it.widthMm = mm(it.rotated ? bs.z : bs.x);
  it.heightMm = mm(bs.y);
  const y0 = bb.min.y;
  it.band = bs.y >= 1.9 ? 'column' : y0 >= 2.1 ? 'top' : y0 >= 1.3 ? 'wall' : 'base';
  it.bandLabel = { column: 'Coloană', top: 'Rând superior', wall: 'Suspendat', base: 'Bază' }[it.band];
  // A body inserted from the catalogue keeps the identity the user picked; only
  // the room's original bodies are named by inspecting their meshes.
  it.label = (it.build && BODIES[it.build] && BODIES[it.build].label) || LABEL[it.kind] || 'Corp';
  if (it.build) { /* catalogue name wins */ }
  else if (it.kind === 'wall_cabinet' && it.band === 'top') it.label = 'Corp superior';
  else if (it.kind === 'tall_unit') {
    it.label = it.obj.getObjectByName('oven') ? 'Coloană cuptor'
      : it.obj.getObjectByName('fridge_body') ? 'Nișă frigider' : 'Coloană cămară';
  }
  it.doors = []; it.handles = [];
  it.obj.traverse(o => {
    if (!o.isMesh) return;
    if (/door_front|drawer_front/.test(o.name)) it.doors.push(o);
    if (/handle/.test(o.name)) it.handles.push(o);
  });
  it.canFinish = it.doors.length > 0;
  it.canHandle = it.handles.length > 0;
  it.fixedWidth = /fridge|cooktop/.test(it.kind) || it.kind === 'tall_unit';
  it.canReplace = !/corner/.test(it.kind);
  it.canDelete = !/corner/.test(it.kind) && !it.accessory;
}

// The walls themselves are the only truthful reference for seating a body:
// wall A is the back plane (+z fronts), wall B the left plane (+x fronts).
const WALL_A_Z = (room.getObjectByName('wall_back') || { position: { z: 0 } }).position.z;
const WALL_B_X = (room.getObjectByName('wall_left') || { position: { x: 0 } }).position.x;

const bandOfSpan = v => v.h >= 1.9 ? ['column', 'Coloană']
  : v.y0 >= 2.1 ? ['top', 'Rând superior']
  : v.y0 >= 1.3 ? ['wall', 'Suspendat'] : ['base', 'Bază'];

const meta = x => {
  if (x.isVoid) {
    const [band, bandLabel] = bandOfSpan(x);
    return {
      id: x.id, label: 'Loc gol', empty: true,
      band, bandLabel, wall: x.wall, kind: 'empty',
      widthMm: mm(x.w), heightMm: mm(x.h), openWmm: mm(x.w), openHmm: mm(x.h),
      spanHmm: mm(x.spanH !== undefined ? x.spanH : x.h),
      fixedWidth: true, canFinish: false, canHandle: false, canReplace: true,
    };
  }
  return {
    id: x.id, label: x.label, empty: false,
    band: x.band, bandLabel: x.bandLabel, wall: x.wall, kind: x.kind,
    widthMm: x.widthMm, heightMm: x.heightMm,
    openWmm: mm(x.frame.w), openHmm: mm(x.frame.h),
    fixedWidth: x.fixedWidth || !buildIdOf(x), canFinish: x.canFinish, canHandle: x.canHandle,
    minMm: mm(MIN_W),
    sizes: x.isVoid ? [400, 600, 800]
      : (x.kind === 'dishwasher_housing' ? [450, 600]
        : x.kind === 'extractor_hood' ? [600, 900] : [400, 600, 800]),
    growMm: (() => {
      const nb = neighbours(x);
      return mm(Math.max(canGive(nb.right) ? nb.right.frame.w - MIN_W : 0,
                         canGive(nb.left) ? nb.left.frame.w - MIN_W : 0));
    })(),
    donorSide: (() => {
      const nb = neighbours(x);
      return canGive(nb.right) ? 'dreapta' : canGive(nb.left) ? 'stânga' : '';
    })(),
    donorMm: (() => {
      const nb = neighbours(x);
      const m2 = canGive(nb.right) ? nb.right : canGive(nb.left) ? nb.left : null;
      return m2 ? mm(m2.frame.w) : 0;
    })(),
    canReplace: x.canReplace && !x.accessory,
    canDelete: !!x.canDelete,
    accessory: !!x.accessory,
  };
};
const byId = id => items.find(i => i.id === id) || voids.find(v => v.id === id);
// An accessory stands in for the cabinet it is set into.
const hostOf = x => {
  if (!x || x.isVoid || !x.accessory) return x;
  const y = x.frame.y0;
  return items.find(i => !i.accessory && !i.isVoid && i.col === x.col
    && i.frame.y0 <= y + 0.02 && i.frame.y0 + i.frame.h >= y - 0.02) || x;
};

/* ---- selection --------------------------------------------------------- */
let sel = null, outline = null;
const saved = new Map();

function clearOutline() {
  if (outline) { outline.parent.remove(outline); outline.geometry.dispose(); outline = null; }
}
function highlight(it, on) {
  if (it.isVoid) { if (it.mesh) it.mesh.material.opacity = on ? 0.26 : 0.12; return; }
  it.obj.traverse(o => {
    if (!o.isMesh) return;
    if (on) {
      if (!saved.has(o)) saved.set(o, o.material);
      const m = o.material.clone();
      m.emissive = new THREE.Color('#c08d51');
      m.emissiveIntensity = 0.16;
      o.material = m;
    } else if (saved.has(o)) { o.material.dispose?.(); o.material = saved.get(o); saved.delete(o); }
  });
}
function select(it, notify = true) {
  if (sel === it) return;
  if (sel) highlight(sel, false);
  clearOutline();
  sel = it;
  if (!it) { if (notify) post({ t: 'desel' }); return; }
  highlight(it, true);
  const anchor = it.isVoid ? it.mesh : it.obj;
  if (!anchor) { sel = null; if (notify) post({ t: 'desel' }); return; }
  const bb = new THREE.Box3().setFromObject(anchor).expandByScalar(0.012);
  outline = new THREE.Box3Helper(bb, new THREE.Color('#7c5c3d'));
  outline.material.depthTest = false;
  room.add(outline);
  if (notify) post({ t: 'sel', item: meta(it) });
}

const ray = new THREE.Raycaster();
ray.params.Line.threshold = 0.008;
let down = null;
const hit = ev => {
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(
    ((ev.clientX - r.left) / r.width) * 2 - 1,
    -((ev.clientY - r.top) / r.height) * 2 + 1), camera);
  // Solid bodies win over voids: an empty span is empty space, so anything
  // visible through it stays clickable. A void is picked only where no real
  // cabinet sits behind it.
  let hits = ray.intersectObjects(items.map(i => i.obj), true);
  if (!hits.length) hits = ray.intersectObjects(voids.map(v => v.mesh), true);
  if (!hits.length) return null;
  const owner = n => items.find(i => i.obj === n) || voids.find(v => v.mesh === n);
  let o = hits[0].object;
  while (o && !owner(o)) o = o.parent;
  return o ? hostOf(owner(o)) : null;
};
canvas?.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
canvas?.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  down = null;
  if (moved > 7) return;                             // that was an orbit, not a tap
  select(hit(e));
  const t = document.getElementById('tap');
  if (t) t.style.opacity = '0';
});

/* ---- free spans ---------------------------------------------------------
   A void is not a slot left behind by one cabinet: it is whatever vertical
   space in a column no body occupies. Clear a base, a wall and a top unit and
   the three gaps become ONE full-height opening a column can fill; drop a base
   back in and the space above it becomes a void again, ready for a wall unit,
   then a top unit. Deletion is final — there is no undo, so the two models
   can never disagree. */
const MIN_SPAN = 0.3;
// The kitchen's module lines: worktop at 860, wall band 1500–2200, top row
// 2200–2600. A free span is offered level by level against these, so a cleared
// column always presents a base, a middle and a top slot — whatever used to
// stand there.
const LEVELS = [[0, 0.86], [1.5, 2.2], [2.2, 2.6]];
function makeVoidMesh(v) {
  const geo = new THREE.BoxGeometry(
    Math.max(v.w - 0.014, 0.03), Math.max(v.h - 0.014, 0.03), Math.max(v.d - 0.014, 0.03));
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: '#7c5c3d', transparent: true, opacity: 0.12, roughness: 1, depthWrite: false,
  }));
  m.name = 'empty_slot';
  m.rotation.y = v.ry;
  m.position.set(v.x, v.y0 + v.h / 2, v.z);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineDashedMaterial({ color: '#7c5c3d', dashSize: 0.05, gapSize: 0.035 }));
  edges.computeLineDistances();
  edges.name = 'empty_slot_edges';
  // Lines are picked with a metre-wide threshold by default, so a neighbouring
  // void's outline would win the hit test over this box's own face.
  edges.raycast = () => {};
  m.add(edges);
  room.add(m);
  return m;
}
function recomputeVoids() {
  const keepId = sel && sel.isVoid ? sel.id : null;
  voids.forEach(v => { room.remove(v.mesh); v.mesh.geometry.dispose(); });
  voids = [];
  let n = 0;
  cols.forEach(c => {
    const taken = items
      .filter(i => i.col === c.key)
      .map(i => [i.frame.y0, i.frame.y0 + i.frame.h])
      .sort((p, q) => p[0] - q[0]);
    // A run starts where its lowest module starts: a wall-only column has no
    // floor space of its own (the corner unit lives there), so none is offered.
    let y = Math.min(...c.regions.map(reg => reg[0]));
    const free = [];
    taken.forEach(([lo, hi]) => {
      if (lo - y > MIN_SPAN) free.push([y, lo]);
      y = Math.max(y, hi);
    });
    if (c.top - y > MIN_SPAN) free.push([y, c.top]);
    // Only where a module was ever designed to stand: the 640 mm of backsplash
    // between worktop and wall units is not an opening, so it is never offered.
    free.forEach(([lo, hi]) => {
      // One free span, but selectable level by level: a cleared column offers a
      // base slot, a middle slot and a top slot, each pickable on its own —
      // while the span as a whole stays available to a full-height body.
      let levels = LEVELS
        .map(([a2, b2]) => [Math.max(lo, a2), Math.min(hi, b2), a2])
        .filter(([a2, b2]) => b2 - a2 > MIN_SPAN)
        .sort((p2, q2) => p2[0] - q2[0]);
      // A span that starts mid-level is the leftover above a body that does not
      // end on a module line — over a 1850 mm fridge, say. Splitting that into
      // the stubs of two levels would offer two half-height cabinets where the
      // kitchen wants one tall unit, so it stays a single opening.
      if (levels.length > 1 && levels[0][0] > levels[0][2] + 0.02)
        levels = [[levels[0][0], levels[levels.length - 1][1]]];
      levels.forEach(([a2, b2]) => {
        const v = {
          id: 'v' + (n++), isVoid: true, col: c.key,
          x: c.x, z: c.z, ry: c.ry, w: c.w, d: c.d,
          y0: a2, h: b2 - a2,
          spanY0: lo, spanH: hi - lo,
          wall: c.key[0], empty: true,
        };
        v.mesh = makeVoidMesh(v);
        voids.push(v);
      });
    });
  });
  if (keepId) {
    // keep the panel pointed at the same opening when one still covers it
    const same = voids.find(v => v.id === keepId) || null;
    if (!same) sel = null;
  }
}

/* ---- runs: who can give width to whom ----------------------------------
   A cabinet does not own a width; a run of neighbours shares a total. Growing
   one takes millimetres from the neighbour beside it, so the wall length is
   conserved and two bodies can never overlap. */
const MIN_W = 0.3;
const axisOf = x => (x.rotated ? 'z' : 'x');
function countMesh(obj, re) {
  let n = 0;
  obj.traverse(o => { if (o.isMesh && re.test(o.name)) n++; });
  return n;
}
// Which catalogue body this placement is, so it can be rebuilt at a new width.
function buildIdOf(it) {
  if (!it || it.isVoid || !it.obj) return null;
  if (it.build) return it.build;
  const drawers = countMesh(it.obj, /drawer_front/);
  switch (it.kind) {
    case 'base_cabinet':
      if (it.obj.getObjectByName('faucet') || it.obj.getObjectByName('bowl_floor')) return 'base-sink';
      if (drawers >= 3) return 'base-3drawer';
      if (drawers === 2) return 'base-panbank';
      return countMesh(it.obj, /door_front/) >= 2 ? 'base-2door' : 'base-1door';
    case 'wall_cabinet':
      return countMesh(it.obj, /door_front/) >= 2 ? 'wall-2door' : 'wall-1door';
    case 'dishwasher_housing': return 'base-dishwasher';
    case 'open_shelf_unit': return 'open-shelf';
    case 'extractor_hood': return 'hood';
    default: return null;
  }
}
const canGive = m => !!(m && !m.accessory && !m.fixedWidth && !/corner/.test(m.kind) && buildIdOf(m));
function neighbours(it) {
  if (!it || it.isVoid) return {};
  const a = axisOf(it);
  const c = it.frame[a], half = it.frame.w / 2;
  const mates = items.filter(m => m !== it && !m.accessory && m.rotated === it.rotated
    && Math.abs(m.frame.y0 - it.frame.y0) < 0.06);
  return {
    right: mates.find(m => Math.abs((m.frame[a] - m.frame.w / 2) - (c + half)) < 0.03),
    left: mates.find(m => Math.abs((m.frame[a] + m.frame.w / 2) - (c - half)) < 0.03),
  };
}
function applyFinish(it, key) {
  const f = FINISH[key];
  if (!f) return;
  it.doors.forEach(o => {
    const src = f.base === 'oak' ? M.oak : M.door;
    const mat = src.clone();
    if (f.color) mat.color = new THREE.Color(f.color);
    mat.name = 'door_' + key;
    o.material = mat;
  });
}
function applyHandle(it, mode) {
  it.handles.forEach(o => {
    o.visible = mode !== 'push';
    if (mode === 'push') return;
    const mat = M.steel.clone();
    if (mode === 'black') mat.color = new THREE.Color('#26282a');
    mat.name = 'handle_' + mode;
    o.material = mat;
  });
}
function rebuild(m, w, centre) {
  const b = BODIES[buildIdOf(m)];
  const h = b.hFlex ? m.frame.h : b.h;
  const g = b.mk(w, h, m.frame.d);
  const a = axisOf(m);
  const pos = { x: m.frame.x, y: m.frame.y0, z: m.frame.z };
  pos[a] = centre;
  g.rotation.y = m.frame.ry;
  g.position.set(pos.x, pos.y, pos.z);
  room.add(g);
  g.updateWorldMatrix(true, true);
  const bb = new THREE.Box3().setFromObject(g);
  const rot = Math.abs(m.frame.ry) > 0.01;
  const shift = (rot ? WALL_B_X : WALL_A_Z) - (rot ? bb.min.x : bb.min.z);
  if (rot) g.position.x += shift; else g.position.z += shift;
  room.remove(m.obj);
  m.obj = g;
  m.frame = Object.assign({}, m.frame, { w });
  m.frame[a] = centre;
  describe(m);
  if (m.finishKey) applyFinish(m, m.finishKey);
  if (m.handleMode) applyHandle(m, m.handleMode);
  else if (m.band === 'top') m.handles.forEach(o => { o.visible = false; });
}
function setWidth(target) {
  const it = sel;
  if (!it || it.isVoid) return;
  const own = it.kind === 'dishwasher_housing' ? [0.45, 0.6]
    : it.kind === 'extractor_hood' ? [0.6, 0.9] : null;
  if (own && !own.some(v => Math.abs(v - target) < 0.005)) {
    post({ t: 'rejected', msg: 'Acest corp există doar în ' + own.map(v => mm(v)).join(' și ') + ' mm.' });
    return;
  }
  if (it.fixedWidth || !buildIdOf(it)) {
    post({ t: 'rejected', msg: 'Acest corp are lățime fixă.' });
    return;
  }
  const cur = it.frame.w, d = target - cur;
  if (Math.abs(d) < 0.005) return;
  const nb = neighbours(it);
  const donor = d > 0
    ? [nb.right, nb.left].find(m => canGive(m) && m.frame.w - d >= MIN_W - 1e-6)
    : [nb.right, nb.left].find(m => canGive(m));
  if (!donor) {
    post({
      t: 'rejected',
      msg: d > 0
        ? 'Nu e loc: vecinul ar coborî sub ' + mm(MIN_W) + ' mm. Șterge un corp de lângă sau împarte peretele altfel.'
        : 'Nu există un vecin care să preia cei ' + mm(-d) + ' mm eliberați.',
    });
    return;
  }
  const a = axisOf(it);
  const dir = donor === nb.right ? 1 : -1;
  const itEdge = it.frame[a] - dir * cur / 2;              // edge away from the donor holds
  const donorEdge = donor.frame[a] + dir * donor.frame.w / 2;
  const donorW = donor.frame.w - d;
  rebuild(it, target, itEdge + dir * target / 2);
  rebuild(donor, donorW, donorEdge - dir * donorW / 2);
  sel = null;
  recomputeVoids();
  select(it);
}

/* ---- the body catalogue -------------------------------------------------
   'fit' width means the body is parameterised and builds to the opening;
   hFlex means the same for height, capped at its nominal. Everything else is
   a fixed-size appliance or column and is refused when it does not fit. */
const BODIES = {
  'base-2door':      { label: 'Corp bază 2 uși', band: 'base', w: 'fit', h: 0.86, mk: (w) => make.baseCabinet(w, { doors: 2 }) },
  'base-1door':      { label: 'Corp bază 1 ușă', band: 'base', w: 'fit', h: 0.86, mk: (w) => make.baseCabinet(w, { doors: 1 }) },
  'base-3drawer':    { label: 'Corp bază 3 sertare', band: 'base', w: 'fit', h: 0.86, mk: (w) => make.baseCabinet(w, { drawers: 3 }) },
  'base-panbank':    { label: 'Sertare pentru oale', band: 'base', w: 'fit', h: 0.86, mk: (w) => make.baseCabinet(w, { drawers: 2 }) },
  'base-sink':       { label: 'Corp spălător', band: 'base', w: 'fit', h: 0.86, mk: (w) => make.baseCabinet(w, { doors: 2, sink: true }) },
  'base-dishwasher': { label: 'Nișă mașină de spălat vase', band: 'base', w: 0.60, h: 0.86, sizes: [450, 600], mk: (w) => make.dishwasherHousing(w >= 0.55 ? 0.6 : 0.45) },
  'wall-2door':      { label: 'Corp suspendat 2 uși', band: 'wall', w: 'fit', h: 0.70, hFlex: true, mk: (w, h, d) => make.wallCabinet(w, w > 0.45 ? 2 : 1, h, Math.min(d, 0.4)) },
  'wall-1door':      { label: 'Corp suspendat 1 ușă', band: 'wall', w: 'fit', h: 0.70, hFlex: true, mk: (w, h, d) => make.wallCabinet(w, 1, h, Math.min(d, 0.4)) },
  'wall-lift':       { label: 'Corp suspendat rabatabil', band: 'wall', w: 'fit', h: 0.70, hFlex: true, mk: (w, h, d) => make.wallCabinet(w, 1, h, Math.min(d, 0.4), true) },
  'open-shelf':      { label: 'Etajeră deschisă', band: 'wall', w: 'fit', h: 0.70, hFlex: true, mk: (w, h, d) => make.openShelf(w, Math.min(d, 0.4), 2, h) },
  'hood':            { label: 'Hotă', band: 'wall', w: 'fit', h: 0.71, mk: (w) => make.hood(w) },
  'tall-pantry':     { label: 'Coloană cămară', band: 'column', w: 0.60, h: 2.20, mk: () => builders['tall-pantry']() },
  'tall-oven-tower': { label: 'Coloană cuptor + microunde', band: 'column', w: 0.60, h: 2.20, mk: () => builders['tall-oven-tower']() },
  'tall-fridge-housing': { label: 'Nișă frigider integrat', band: 'column', w: 0.60, h: 2.20, mk: () => builders['tall-fridge-housing']() },
  'fridge-free':     { label: 'Frigider, liber', band: 'column', w: 0.70, h: 1.80, mk: () => builders['fridge-free']() },
};

function removeSel() {
  if (!sel || sel.isVoid || sel.accessory) return;
  if (!sel.canDelete) {
    post({ t: 'rejected', msg: 'Corpul de colț ține legătura dintre cei doi pereți — nu poate fi șters.' });
    return;
  }
  const it = sel;
  highlight(it, false);
  clearOutline();
  room.remove(it.obj);
  const at = items.indexOf(it);
  if (at >= 0) items.splice(at, 1);
  sel = null;
  recomputeVoids();
  // land the panel on the opening that just appeared
  const v = voids.find(v2 => v2.col === it.col && v2.y0 <= it.frame.y0 + 0.02 && v2.y0 + v2.h >= it.frame.y0 + it.frame.h - 0.02)
    || voids.find(v2 => v2.col === it.col);
  select(v || null);
}
let seq = 0;
function insertBody(id) {
  if (!sel) return;
  // A swap is an insert into the opening the body already fills, so both go
  // through the same fit guards — they cannot drift apart.
  const replacing = sel.isVoid ? null : sel;
  const v = sel.isVoid ? sel : {
    col: sel.col, x: sel.frame.x, z: sel.frame.z, ry: sel.frame.ry,
    y0: sel.frame.y0, h: sel.frame.h, w: sel.frame.w, d: sel.frame.d, wall: sel.wall,
  };
  const b = BODIES[id];
  if (!b) { post({ t: 'rejected', msg: 'Corpul nu există încă în bibliotecă.' }); return; }
  const TOL = 0.012;
  // A body belongs to a band: a wall carcass has no plinth and no worktop, so
  // it can never stand on the floor, and a base cabinet cannot hang.
  const target = sel.isVoid
    ? (v.h >= 1.9 ? 'column' : v.y0 < 0.2 ? 'base' : 'wall')
    : (sel.band === 'column' ? 'column' : sel.band === 'base' ? 'base' : 'wall');
  if (b.band !== 'column' && target !== 'column' && b.band !== target) {
    post({
      t: 'rejected',
      msg: b.band === 'base'
        ? 'Un corp bază are plintă și blat — nu poate fi suspendat.'
        : 'Un corp suspendat nu are plintă și blat — nu poate sta pe podea.',
    });
    return;
  }
  const w = b.w === 'fit' ? v.w : b.w;
  if (w > v.w + TOL) {
    post({ t: 'rejected', msg: 'Corpul are ' + mm(w) + ' mm lățime și nu intră în locul de ' + mm(v.w) + ' mm.' });
    return;
  }
  // The level is the default target; the free span around it is the limit. A
  // full-height body picked on any level of a cleared column takes the column.
  const spanY0 = v.spanY0 !== undefined ? v.spanY0 : v.y0;
  const spanH = v.spanH !== undefined ? v.spanH : v.h;
  // A height-parametric body fills its opening outright when the opening is
  // cabinet-sized — the 750 mm over a fridge takes a 750 mm unit, not a 700 mm
  // one with a 50 mm strip of air above it. Bigger openings fall back to the
  // nominal height so a cleared column does not build a 2600 mm wall unit.
  const h = b.hFlex ? (v.h <= 0.9 ? v.h : b.h) : b.h;
  // Only a full-height body may reach past the level you picked; a base cabinet
  // chosen on the top slot would otherwise land on the floor. Whether a body is
  // full-height is its catalogue band, not a height threshold — a 1800 mm
  // freestanding fridge is one, a 860 mm base cabinet never is.
  const takesSpan = h > v.h + TOL;
  if (takesSpan && b.band !== 'column') {
    post({ t: 'rejected', msg: 'Corpul are ' + mm(h) + ' mm înălțime și nu intră în nivelul de ' + mm(v.h) + ' mm.' });
    return;
  }
  const room4 = spanY0 + spanH - (takesSpan ? spanY0 : v.y0);
  if (h > room4 + TOL) {
    post({ t: 'rejected', msg: 'Corpul are ' + mm(h) + ' mm înălțime și nu intră în locul de ' + mm(room4) + ' mm.' });
    return;
  }
  const g = b.mk(w, h, v.d);
  const gb = new THREE.Box3().setFromObject(g);   // still in local space
  const carc = new THREE.Box3();
  g.traverse(o => {
    if (o.isMesh && /carcass_shell|side_left|side_right|panel_bottom|plinth|counter|fridge_body|hood_canopy|dw_body/.test(o.name))
      carc.expandByObject(o);
  });
  const gs = (carc.isEmpty() ? gb : carc).getSize(V());
  const roomH = spanY0 + spanH - (gs.y > v.h + TOL ? spanY0 : v.y0);
  if (gs.x > v.w + TOL || gs.y > roomH + TOL) {
    post({ t: 'rejected', msg: 'Corpul construit are ' + mm(gs.x) + ' × ' + mm(gs.y) + ' mm și nu intră în locul de ' + mm(v.w) + ' × ' + mm(roomH) + ' mm.' });
    return;
  }
  // Sit on a real module line, not wherever the void happens to start: a wall
  // unit dropped into a cleared column belongs at 1500 mm, above the
  // backsplash, not flush on the worktop.
  const c = cols.get(v.col);
  const overLevel = gs.y > v.h + TOL;
  const minY = overLevel ? spanY0 : v.y0;
  const fits = y => y >= minY - 0.02 && y + gs.y <= spanY0 + spanH + 0.02;
  const lines = LEVELS.map(l => l[0])
    .concat(c ? c.regions.map(reg => reg[0]) : [])
    .concat(minY)
    .filter(fits)
    .sort((p2, q2) => p2 - q2);
  const y0 = lines.length ? lines[0] : minY;
  // Push the body back against the wall. The opening's depth is whatever used
  // to stand there — a 600 deep fridge — so centring a 330 deep wall unit in it
  // would leave it floating 135 mm off the wall.
  const rotatedV = Math.abs(v.ry) > 0.01;
  g.position.set(v.x, replacing ? v.y0 : y0, v.z);
  g.rotation.y = v.ry;
  if (replacing) {
    highlight(replacing, false);
    room.remove(replacing.obj);
    const at = items.indexOf(replacing);
    if (at >= 0) items.splice(at, 1);
  }
  room.add(g);
  // Seat the carcass against the wall. The opening's depth is whatever used to
  // stand there — a 600 deep fridge — so a 330 deep wall unit centred in it
  // would float off the wall. Measured after placing, because doors, handles
  // and chamfers make the group's own origin unreliable.
  g.updateWorldMatrix(true, true);
  const placed = new THREE.Box3().setFromObject(g);
  const wallPlane = rotatedV ? WALL_B_X : WALL_A_Z;
  const shift = wallPlane - (rotatedV ? placed.min.x : placed.min.z);
  if (rotatedV) g.position.x += shift; else g.position.z += shift;
  const it = {
    id: 'n' + (seq++), obj: g, doors: [], handles: [], kind: g.name,
    empty: false, col: v.col, rotated: Math.abs(v.ry) > 0.01, wall: v.wall, build: id,
    frame: { x: v.x, z: v.z, ry: v.ry, y0: replacing ? v.y0 : y0, h: replacing ? v.h : gs.y, w: v.w, d: v.d },
    // the opening keeps its own depth; the body just sits at the back of it
  };
  items.push(it);
  describe(it);
  // Same default for anything inserted into the top row: hidden bars, so it
  // reads as push-to-open but the handle section still applies.
  if (it.band === 'top') it.handles.forEach(o => { o.visible = false; });
  clearOutline();
  sel = null;
  recomputeVoids();
  select(it);
}

/* ---- edits ------------------------------------------------------------- */
const FINISH = {
  white: { color: '#eceeeb', base: 'door' },
  clay:  { color: '#cbc3b8', base: 'door' },
  sage:  { color: '#8d9a84', base: 'door' },
  graphite: { color: '#2b2d30', base: 'door' },
  oak:   { color: null, base: 'oak' },
};
function setFinish(key) {
  const f = FINISH[key]; if (!sel || !f) return;
  sel.finishKey = key;
  sel.doors.forEach(o => {
    const src = f.base === 'oak' ? M.oak : M.door;
    const m = src.clone();
    if (f.color) m.color = new THREE.Color(f.color);
    m.name = 'door_' + key;
    o.material = m;
    saved.set(o, m);                                  // survives deselect
    const lit = m.clone();
    lit.emissive = new THREE.Color('#c08d51'); lit.emissiveIntensity = 0.16;
    o.material = lit;
  });
}
function setHandle(mode) {
  if (!sel) return;
  sel.handleMode = mode;
  sel.handles.forEach(o => {
    o.visible = mode !== 'push';
    if (mode === 'push') return;
    const m = M.steel.clone();
    if (mode === 'black') m.color = new THREE.Color('#26282a');
    m.name = 'handle_' + mode;
    o.material = m; saved.set(o, m);
    const lit = m.clone(); lit.emissive = new THREE.Color('#c08d51'); lit.emissiveIntensity = 0.16;
    o.material = lit;
  });
}
// The room is 2.6 m tall: every view has to frame floor to ceiling, or the top
// row lands on the frame edge and becomes unclickable.
const VIEWS = {
  overview: { pos: [4.3, 3.0, 5.3], target: [1.6, 1.35, 0.85] },
  wallA: { pos: [1.9, 2.1, 5.6], target: [1.7, 1.35, 0.45] },
  wallB: { pos: [5.4, 2.2, 2.3], target: [0.5, 1.35, 1.75] },
};
function setView(k) {
  const v = VIEWS[k] || VIEWS.overview;
  camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
  controls.target.set(v.target[0], v.target[1], v.target[2]);
  controls.update();
}
// Frame one placement head-on. Units high up or behind a column are almost
// impossible to hit from a fixed room view, so selecting from the panel list
// brings the camera to the unit instead of asking the user to fight the orbit.
function focusOn(it) {
  const anchor = it.isVoid ? it.mesh : it.obj;
  const target = new THREE.Box3().setFromObject(anchor).getCenter(V());
  const size = new THREE.Box3().setFromObject(anchor).getSize(V());
  const reach = Math.max(size.x, size.y, size.z, 0.6) * 2.6 + 0.9;
  const dir = it.rotated ? new THREE.Vector3(1, 0.32, 0.42) : new THREE.Vector3(0.42, 0.32, 1);
  dir.normalize().multiplyScalar(reach);
  camera.position.copy(target).add(dir);
  controls.target.copy(target);
  controls.update();
}
setView('overview');

/* ---- host bridge ------------------------------------------------------- */
const post = msg => parent !== window && parent.postMessage({ src: 'lemnaria-scene', ...msg }, '*');
addEventListener('message', e => {
  const d = e.data; if (!d || d.src === 'lemnaria-scene') return;
  switch (d.t) {
    case 'finish': setFinish(d.value); break;
    case 'handle': setHandle(d.value); break;
    case 'select': {
      const it = hostOf(byId(d.id));
      select(it);
      if (it && d.focus) focusOn(it);
      break;
    }
    case 'deselect': select(null); break;
    case 'view': setView(d.value); break;
    case 'remove': removeSel(); break;
    case 'insert': insertBody(d.value); break;
    case 'width': setWidth(d.value / 1000); break;
    case 'hint': { const t = document.getElementById('tap'); if (t) t.style.opacity = d.value ? '1' : '0'; break; }
  }
});
// Embedded in a configurator frame the host draws its own gesture hint.
if (parent !== window) document.getElementById('tap').remove();
// Debug/probe surface — lets the host (and automated checks) drive selection
// and read placement state without going through the pointer path.
window.__lem = {
  items, camera, controls, room, recomputeVoids,
  get sel() { return sel; },
  select: id => select(byId(id)),
  get voids() { return voids; },
  centerOf: id => {
    const it = byId(id);
    if (!it) return null;
    return new THREE.Box3().setFromObject(it.isVoid ? it.mesh : it.obj).getCenter(V());
  },
};
recomputeVoids();
post({ t: 'ready', items: items.map(meta) });
</script>
</body>
</html>
